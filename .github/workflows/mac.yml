name: macOS

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build mac/UWUVCI.Mac.slnx -c Release -warnaserror
      - name: Test
        run: dotnet test mac/UWUVCI.Mac.slnx -c Release --no-build
      - name: Package
        run: mac/scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: UWUVCI-macOS-arm64
          path: mac/dist/*.zip
